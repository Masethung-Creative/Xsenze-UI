<div class="xz-error-page">
  <header class="xz-navbar xz-navbar--static">

  <main class="xz-error-page__main">
    <p class="xz-error-page__code" aria-hidden="true">500</p>

      <button class="xz-btn xz-btn--primary xz-btn--lg" type="button" onclick="location.reload()"><i data-xz-icon="refresh-cw"></i> Try again</button>
      <a class="xz-btn xz-btn--lg" href="./dashboard.html">Go to dashboard</a>
    </div>
    <!-- Print the request id and time from your server here. -->
    <p class="xz-error-page__ref">Reference XZ-7F3A-2291 · 15 Nov 2026, 2:30 pm</p>
  </main>

  <footer class="xz-footer xz-footer--simple">
    <div class="xz-footer__bottom">
      <span>© 2026 Xsenze</span>
      <a class="xz-link xz-link--quiet" href="mailto:support@example.com">Contact support</a>
    </div>
  </footer>
