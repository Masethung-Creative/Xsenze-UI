<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Reset password · Xsenze</title>
<link rel="stylesheet" href="../dist/xsenze.min.css">
<script src="../dist/xsenze.min.js" defer></script>
</head>
<body>
<!-- Single centred panel: the inline style keeps the auth grid to one column. -->
<div class="xz-auth xz-auth--single">
  <main class="xz-auth__main">
    <div class="xz-auth__panel xz-stack xz-gap-8">
      <a class="xz-logo" href="./login.html">Xsenze</a>

      <div>
        <header class="xz-auth__header">
          <h1 class="xz-auth__title">Reset your password</h1>
          <p class="xz-auth__text">Enter the email you signed up with. We will send you a link to set a new password.</p>
        </header>

        <form class="xz-form" id="reset-form" data-xz-validate action="#" method="post">
          <div class="xz-field">
            <label class="xz-label" for="email">Email</label>
            <input class="xz-input xz-input--lg" id="email" name="email" type="email" autocomplete="email" placeholder="name@company.in" required>
          </div>
          <button class="xz-btn xz-btn--primary xz-btn--lg xz-btn--block" type="submit">Send reset link</button>
        </form>

        <!-- Shown in place of the form after it is sent. The wording does not reveal whether the account exists. -->
        <div class="xz-alert xz-alert--success" id="reset-sent" role="status" tabindex="-1" hidden>
          <i data-xz-icon="circle-check"></i>
          <div class="xz-alert__body">
            <p class="xz-alert__title">Check your email</p>
            <p class="xz-alert__text">If an account exists for <strong id="reset-email"></strong>, a reset link is on its way. The link works for 30 minutes.</p>
          </div>
        </div>
      </div>

      <p><a class="xz-link xz-link--standalone" href="./login.html"><i data-xz-icon="arrow-left" data-size="sm"></i> Back to sign in</a></p>
    </div>
  </main>
</div>

<script>
  // Runs after the kit has attached its validation, so this only fires for a valid form.
  // Replace with a real request to your server.
  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('reset-form');
    var sent = document.getElementById('reset-sent');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('reset-email').textContent = form.email.value;
      form.hidden = true;
      sent.hidden = false;
      sent.focus();
    });
  });
</script>
</body>
</html>
